name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # No registry-url: it writes an .npmrc with an empty _authToken, which
          # makes `npm info` 401 so changesets thinks the current version is
          # unpublished. Trusted publishing needs no .npmrc auth at all.

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN involved.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing authenticates through npm trusted publishing (OIDC, the
          # id-token permission above), configured on npmjs.com for this repo +
          # release.yml. No long-lived npm token.
